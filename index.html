<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartStudy AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #0f172a;
  --card: rgba(255,255,255,0.05);
  --text: white;
}

.light {
  --bg: #f1f5f9;
  --card: white;
  --text: black;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

#loginPage {
  display:flex; justify-content:center; align-items:center; height:100vh;
}

.box {
  background: var(--card);
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(10px);
}

input, textarea, button {
  width: 100%; padding:10px; margin-top:10px; border-radius:8px; border:none;
}

button {
  background: linear-gradient(135deg,#3b82f6,#6366f1);
  color:white;
  cursor:pointer;
}

.sidebar {
  width:220px; height:100vh; position:fixed; padding:20px;
  background:rgba(0,0,0,0.6);
}

.main { margin-left:240px; padding:20px; }

.card {
  background: var(--card);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  transition:0.3s;
}
.card:hover { transform:translateY(-5px); }

.page { animation:fade 0.4s ease; }

@keyframes fade {
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

@media(max-width:768px){
  .sidebar{position:relative;width:100%;height:auto;}
  .main{margin-left:0;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="box">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="sidebar">
    <h3>SmartStudy</h3>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('planner')">Planner</button>
    <button onclick="showPage('ai')">AI</button>
    <button onclick="toggleTheme()">Theme</button>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="main">

    <!-- Dashboard -->
    <div id="dashboard" class="page">
      <div class="card">
        <h2>Dashboard</h2>
        <p>Total: <span id="totalTasks">0</span></p>
        <p>Done: <span id="completedTasks">0</span></p>
        <canvas id="chart"></canvas>
      </div>

      <div class="card">
        <h2>Study Timer</h2>
        <h1 id="timer">25:00</h1>
        <button onclick="startTimer()">Start</button>
      </div>
    </div>

    <!-- Planner -->
    <div id="planner" class="page" style="display:none;">
      <div class="card">
        <h2>Add Task</h2>
        <input id="taskName">
        <button onclick="addTask()">Add</button>
      </div>

      <div class="card">
        <ul id="taskList"></ul>
      </div>
    </div>

    <!-- AI -->
    <div id="ai" class="page" style="display:none;">
      <div class="card">
        <h2>AI Assistant</h2>
        <textarea id="aiInput"></textarea>
        <button onclick="runAI()">Generate</button>
        <p id="aiOutput"></p>
      </div>
    </div>

  </div>
</div>

<script>
/* LOGIN */
if(localStorage.getItem("user")){
  document.getElementById("loginPage").style.display="none";
  document.getElementById("app").style.display="block";
}

/* AUTH */
function login(){
  let u=username.value, p=password.value;
  if(!u||!p)return alert("Fill all fields");
  localStorage.setItem("user",u);
  location.reload();
}
function logout(){
  localStorage.clear(); location.reload();
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* NAV */
function showPage(p){
  document.querySelectorAll(".page").forEach(x=>x.style.display="none");
  document.getElementById(p).style.display="block";
}

/* TASKS */
let tasks=JSON.parse(localStorage.getItem("tasks"))||[];

function save(){ localStorage.setItem("tasks",JSON.stringify(tasks)); }

function addTask(){
  if(!taskName.value)return;
  tasks.push({name:taskName.value,done:false});
  taskName.value="";
  save(); render();
  notify("Task added");
}

function toggle(i){
  tasks[i].done=!tasks[i].done;
  save(); render();
}

function render(){
  let list=document.getElementById("taskList");
  list.innerHTML="";
  let done=0;

  tasks.forEach((t,i)=>{
    let li=document.createElement("li");
    li.innerHTML=`${t.name} <button onclick="toggle(${i})">✔</button>`;
    list.appendChild(li);
    if(t.done)done++;
  });

  totalTasks.innerText=tasks.length;
  completedTasks.innerText=done;

  drawChart(done,tasks.length);
}
render();

/* CHART */
function drawChart(done,total){
  let ctx=document.getElementById("chart");
  new Chart(ctx,{
    type:'doughnut',
    data:{labels:['Done','Left'],datasets:[{data:[done,total-done]}]}
  });
}

/* TIMER */
let t=1500, int;
function startTimer(){
  clearInterval(int);
  int=setInterval(()=>{
    if(t<=0)return clearInterval(int);
    t--;
    let m=Math.floor(t/60), s=t%60;
    timer.innerText=`${m}:${s.toString().padStart(2,'0')}`;
  },1000);
}

/* AI */
function runAI(){
  let input=aiInput.value;
  aiOutput.innerText=
`Summary:
${input.split(".").slice(0,2).join(".")}.

Key Idea:
Focuses on ${input.split(" ")[0]}.

Question:
Explain ${input.split(" ")[0]}.`;
}

/* NOTIFICATION */
function notify(msg){
  alert(msg);
}
</script>

</body>
</html>
